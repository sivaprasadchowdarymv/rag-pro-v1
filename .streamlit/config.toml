# Streamlit server settings (read automatically by `streamlit run app.py`)

[server]
headless = true
# Upload limit in MB (the app also enforces MAX_UPLOAD_MB).
# In Docker this is set from MAX_UPLOAD_MB via STREAMLIT_SERVER_MAX_UPLOAD_SIZE.
maxUploadSize = 25
enableXsrfProtection = true
enableCORS = true

[browser]
gatherUsageStats = false

[client]
# Never show Python stack traces to visitors (they are still logged on the server)
showErrorDetails = false
# Hide developer menu items (Deploy, Rerun settings...) from visitors
toolbarMode = "viewer"  # viewers can switch light/dark theme in ⋮ → Settings

# Accent colour for both themes. Using [theme.light]/[theme.dark] (not [theme]) keeps
# automatic light/dark switching (viewers can change it in ⋮ → Settings).
[theme.light]
primaryColor = "#3B6FE0"

[theme.dark]
primaryColor = "#6F95F0"
